<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.35"/>
  <rect x="22" y="22" width="468" height="468" rx="104" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Geometric Polygonal Outer Accent Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="16 12" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Iconic Futuristic 'M' Wing Glyphs -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M 128 368 L 128 174 C 128 160, 142 150, 155 156 L 240 220 C 248 226, 252 232, 252 242 L 252 352 C 252 362, 238 368, 230 360 L 146 280 C 138 272, 128 278, 128 290 Z" fill="url(#mGrad)"/>

    <!-- Right Wing -->
    <path d="M 384 368 L 384 174 C 384 160, 370 150, 357 156 L 272 220 C 264 226, 260 232, 260 242 L 260 352 C 260 362, 274 368, 282 360 L 366 280 C 374 272, 384 278, 384 290 Z" fill="url(#mGrad)"/>

    <!-- Center Top Node -->
    <polygon points="256,134 274,166 256,198 238,166" fill="#67e8f9"/>
    
    <!-- Center Glowing Singularity Core -->
    <circle cx="256" cy="256" r="28" fill="url(#coreGrad)" stroke="#e0f2fe" stroke-width="3"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>
  </g>

  <!-- Orbital Sensor Dots -->
  <circle cx="256" cy="80" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="256" cy="432" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="80" cy="256" r="6" fill="#06b6d4" opacity="0.6"/>
  <circle cx="432" cy="256" r="6" fill="#06b6d4" opacity="0.6"/>
</svg>
